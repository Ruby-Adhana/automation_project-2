<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Admission Form</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }

    button {
      background: #28a745;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .filter {
      margin: 20px auto;
      max-width: 600px;
    }
  </style>
</head>
<body>

<h2>Student Admission Form</h2>

<form id="admissionForm">
  <input type="text" id="name" placeholder="Student Name" required>

  <select id="gender" required>
    <option value="">Select Gender</option>
    <option value="Boy">Boy</option>
    <option value="Girl">Girl</option>
  </select>

  <input type="text" id="father" placeholder="Father Name" required>
  <input type="text" id="mother" placeholder="Mother Name" required>
  <input type="text" id="occupation" placeholder="Parent Occupation">

  <input type="text" id="school" placeholder="Last School" required>
  <input type="text" id="class" placeholder="Last Class" required>
  <label>Upload Photo:</label>
  <input type="file" id="photo" accept="image/*">
  <button type="submit">Submit</button>
</form>

<div class="filter">
  <input type="text" id="searchName" placeholder="Search by Name">
  <select id="filterGender">
    <option value="">Filter by Gender</option>
    <option value="Boy">Boy</option>
    <option value="Girl">Girl</option>
  </select>
</div>

<table id="dataTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Gender</th>
      <th>Father</th>
      <th>Mother</th>
      <th>Occupation</th>
      <th>School</th>
      <th>Class</th>
      <th>Photo</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

  const API_URL = "http://YOUR-ALB-DNS.ap-south-1.elb.amazonaws.com";

  const form = document.getElementById("admissionForm");

  const table = document.querySelector("#dataTable tbody");

  let students = [];


  // ============================
  // LOAD STUDENTS FROM BACKEND
  // ============================

  async function loadData() {

    try {

      const res = await fetch(`${API_URL}/students`);

      const data = await res.json();

      students = data;

      displayData(students);

    } catch (error) {

      console.log("Load Error:", error);

      alert("Failed to load students");
    }
  }


  // ============================
  // SAVE STUDENT
  // ============================

  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    try {

      const formData = new FormData();

      formData.append("name", document.getElementById("name").value);

      formData.append("gender", document.getElementById("gender").value);

      formData.append("father", document.getElementById("father").value);

      formData.append("mother", document.getElementById("mother").value);

      formData.append("occupation", document.getElementById("occupation").value);

      formData.append("school", document.getElementById("school").value);

      formData.append("class", document.getElementById("class").value);

      const file = document.getElementById("photo").files[0];

      if (file) {
        formData.append("photo", file);
      }

      const response = await fetch(`${API_URL}/addStudent`, {

        method: "POST",

        body: formData
      });

      if (!response.ok) {

        throw new Error("Failed to save");
      }

      await loadData();

      alert("Saved Successfully ✅");

      form.reset();

    } catch (error) {

      console.log("Submit Error:", error);

      alert("Failed To Save Student");
    }
  });


  // ============================
  // DISPLAY DATA
  // ============================

  function displayData(data) {

    table.innerHTML = "";

    data.forEach(s => {

      let row = `
        <tr>
          <td>${s.name}</td>
          <td>${s.gender}</td>
          <td>${s.father}</td>
          <td>${s.mother}</td>
          <td>${s.occupation}</td>
          <td>${s.school}</td>
          <td>${s.class}</td>

          <td>
            <img 
              src="${s.photo}" 
              width="60"
              height="60"
              style="object-fit:cover;border-radius:6px;"
            />
          </td>
        </tr>
      `;

      table.innerHTML += row;
    });
  }


  // ============================
  // FILTER STUDENTS
  // ============================

  document.getElementById("searchName")
    .addEventListener("input", filterData);

  document.getElementById("filterGender")
    .addEventListener("change", filterData);


  function filterData() {

    let name = document
      .getElementById("searchName")
      .value
      .toLowerCase();

    let gender = document
      .getElementById("filterGender")
      .value;

    let filtered = students.filter(s =>

      s.name.toLowerCase().includes(name) &&

      (gender === "" || s.gender === gender)
    );

    displayData(filtered);
  }


  // ============================
  // PAGE LOAD
  // ============================

  loadData();

</script>

</body>
</html>
